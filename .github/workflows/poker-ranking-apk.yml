name: Compilar Poker Ranking Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/poker-ranking-flutuante-v1.4.zip'
      - 'android/README.md'
      - 'android/patch_persistent.py'
      - '.github/workflows/poker-ranking-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair projeto Android
        run: mkdir -p android-src && unzip -q android/poker-ranking-flutuante-v1.4.zip -d android-src
      - name: Adicionar bolha persistente e ajustes Xiaomi
        run: python3 android/patch_persistent.py android-src
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK de teste
        run: gradle --no-daemon assembleDebug
        working-directory: android-src
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Poker-Ranking-Flutuante-APK-v1.5
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
