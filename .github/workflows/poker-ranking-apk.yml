name: Compilar Poker Ranking Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/poker-ranking-flutuante-v1.4.zip'
      - 'android/README.md'
      - '.github/workflows/poker-ranking-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair projeto Android
        run: mkdir -p android-src && unzip -q android/poker-ranking-flutuante-v1.4.zip -d android-src
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de teste
        run: gradle --no-daemon assembleDebug
        working-directory: android-src
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Poker-Ranking-Flutuante-APK
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
